<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NM-DONAT TAJ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-card {
            background: linear-gradient(135deg, #1c1c1e, #2c2c2e);
            margin: 15px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .balance-title {
            color: #8e8e93;
            font-size: 14px;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0 15px 0;
            color: #ff9f0a;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary {
            background-color: #ff9f0a;
            color: #000;
        }
        .section-title {
            margin: 20px 15px 10px 15px;
            font-size: 16px;
            color: #8e8e93;
        }
        .game-card {
            background: #1c1c1e;
            margin: 10px 15px;
            padding: 15px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2c2c2e;
        }
        .game-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .game-info p {
            margin: 0;
            font-size: 12px;
            color: #8e8e93;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #161618;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            color: #8e8e93;
            font-size: 11px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ff9f0a;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔥 NM-DONAT TAJ</h2>
    </div>

    <div class="user-card">
        <div class="balance-title">БАЛАНСИ ШУМО</div>
        <div class="balance-amount" id="user-balance">0.00 см</div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="alert('Барои пур кардани баланс ба бот чекро фиристед!')">+ Пур кардан</button>
            <button class="btn" onclick="alert('Баровардани маблағ дар ҳоли таҳия аст')">↗ Баровардан</button>
        </div>
    </div>

    <div class="section-title">КАТЕГОРИЯҲО</div>

    <div class="game-card" onclick="alert('Free Fire СНГ интихоб шуд')">
        <div class="game-info">
            <h3>💎 Free Fire СНГ</h3>
            <p>Иҷрои фаврӣ • Автоматикӣ</p>
        </div>
        <span>➔</span>
    </div>

    <div class="game-card" onclick="alert('Free Fire Индонезия интихоб шуд')">
        <div class="game-info">
            <h3>🔥 Free Fire Индонезия</h3>
            <p>Арзон ва боэътимод</p>
        </div>
        <span>➔</span>
    </div>

    <div class="game-card" onclick="alert('PUBG Mobile интихоб шуд')">
        <div class="game-info">
            <h3>🛒 PUBG Mobile (UC)</h3>
            <p>ID лозим аст, бе парол</p>
        </div>
        <span>➔</span>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <div>🏠</div>Асосий
        </a>
        <a href="#" class="nav-item">
            <div>🛒</div>Харидҳо
        </a>
        <a href="#" class="nav-item">
            <div>🎧</div>Дастгирӣ
        </a>
        <a href="#" class="nav-item">
            <div>👤</div>Профил
        </a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
